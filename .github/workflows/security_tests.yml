name: Security Tests

# The sandbox and the token broker are only as good as their tests, and those
# have to run on every OS: each has its own sandbox backend
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-jar:
    name: Agent jar is up to date
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # build.py's JDK_MAJOR: other versions compile slightly different classes
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Rebuild and compare
        run: python3 packages/oneclient_broker/agent/build.py --check

  test:
    name: Tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # 24.04: AppArmor may stop bubblewrap there, leaving Landlock
        platform: [ubuntu-22.04, ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: (Linux) Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang python3 \
            libfontconfig-dev libfreetype-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libdbus-1-dev \
            bubblewrap

      # which backend the escape tests get: bubblewrap, or Landlock where
      # user namespaces are blocked
      - name: (Linux) Report the sandbox backend
        if: runner.os == 'Linux'
        run: |
          echo "apparmor_restrict_unprivileged_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
          if bwrap --ro-bind / / -- /bin/true; then echo "bubblewrap runs"; else echo "bubblewrap is blocked: Landlock only"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-namespace: test-cache
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy (security crates)
        run: cargo clippy -p oneclient_broker -p oneclient_sandbox --all-targets -- -D warnings

      - name: Test
        shell: bash
        env:
          ONECLIENT_TEST_JAVA: java
        run: |
          cargo test \
            -p oneclient_broker \
            -p oneclient_sandbox \
            -p oneclient_auth \
            -p oneclient_cluster \
            -p oneclient_core

      # already built above; shown so a skipped check is visible in the log
      - name: (Unix) Escape tests, with what they ran on and skipped
        if: runner.os != 'Windows'
        run: cargo test -p oneclient_sandbox --test escape_unix -- --nocapture --test-threads=1

  # a real game in the real sandbox: the tests above never open a window,
  # which is how the display bug under WSLg went unseen
  launch:
    name: Real sandboxed launch (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang python3 \
            libfontconfig-dev libfreetype-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libdbus-1-dev \
            bubblewrap xvfb libgl1-mesa-dri imagemagick

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-namespace: test-cache
          save-cache: 'false'

      - name: Build
        run: cargo build -p oneclient_core --example sandbox_launch

      # no GPU here: Mesa draws on the CPU. The screenshot is taken while
      # the example waits before stopping the game
      - name: Launch, check and stop the game
        env:
          DISPLAY: ':99'
          ONECLIENT_DEV_PROMPTS: primary
        run: |
          Xvfb :99 -ac -screen 0 1280x720x24 &
          sleep 2
          ./target/debug/examples/sandbox_launch 1.21.4 --seconds 20 2>&1 | tee launch.log &
          example=$!
          until grep -q -e "Stopping the game in" -e "✗" launch.log 2>/dev/null; do
            kill -0 $example 2>/dev/null || break
            sleep 2
          done
          sleep 5
          import -window root main-menu.png || true
          wait $example
          grep -q "All checks passed" launch.log

      - name: Upload the screenshot and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandboxed-launch
          path: |
            main-menu.png
            launch.log
            target/sandbox-launch/clusters/*/logs/latest.log
            target/sandbox-launch/clusters/*/cluster-output.log
          if-no-files-found: warn
